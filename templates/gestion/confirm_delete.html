{% extends 'base.html' %}
{% block title %}Eliminar · TesisTrack{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm border-danger">
      <div class="card-body p-4">
        <h4 class="text-danger">Eliminar {{ nombre_singular }}</h4>
        <p>¿Seguro que deseas eliminar <strong>{{ object }}</strong>? Esta acción no se puede deshacer.</p>
        <form method="post">
          {% csrf_token %}
          <button class="btn btn-danger" type="submit">Sí, eliminar</button>
          <a class="btn btn-outline-secondary" href="{{ url_cancelar }}">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
