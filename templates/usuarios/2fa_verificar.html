{% extends 'base.html' %}
{% block title %}Verificación · TesisTrack{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-3">Verificación en dos pasos</h4>
        <p class="text-muted">Ingresa el código de tu aplicación autenticadora.</p>
        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">
          {% include 'includes/form_fields.html' %}
          <button class="btn btn-primary w-100" type="submit">Verificar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
