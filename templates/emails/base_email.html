<!doctype html>
<html lang="es">
<body style="margin:0;padding:24px;background:#f1f3f5;font-family:Arial,Helvetica,sans-serif;color:#212529;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center">
    <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;overflow:hidden;">
      <tr><td style="background:#0d6efd;color:#ffffff;padding:16px 24px;font-size:18px;font-weight:bold;">TesisTrack</td></tr>
      <tr><td style="padding:24px;font-size:15px;line-height:1.5;">
        {% block cuerpo %}{% endblock %}
        {% if url %}
        <p style="margin:24px 0;"><a href="{{ url }}" style="background:#0d6efd;color:#ffffff;padding:10px 18px;border-radius:6px;text-decoration:none;">{% block boton %}Abrir en TesisTrack{% endblock %}</a></p>
        {% endif %}
      </td></tr>
      <tr><td style="padding:12px 24px;font-size:12px;color:#6c757d;background:#f8f9fa;">Mensaje automático de TesisTrack. Por favor no respondas a este correo.</td></tr>
    </table>
  </td></tr></table>
</body>
</html>
